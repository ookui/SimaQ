<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; worker-src blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' simaq-asset: data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SimaQ</title>
    <link rel="stylesheet" href="shell.css">
    <link rel="stylesheet" href="editor/editor.css">
    <link rel="stylesheet" href="editor/file-preview.css">
    <link rel="stylesheet" href="editor/vendor/highlight.css">
    <link rel="stylesheet" href="editor/render.css">
    <link rel="stylesheet" href="editor/tables.css">
    <link rel="stylesheet" href="settings.css">
  </head>
  <body>
    <div id="workspaceShell">
      <aside id="sidebar" aria-label="工作区侧栏">
        <div class="side-head">
          <button id="libraryMenu" class="library-button" title="切换工作区">
            <img class="brand-sign" src="brand-q.png" alt=""><span id="workspaceName">SimaQ</span><span
              data-icon="chevronDown"
            ></span>
          </button>
          <button class="sq-icon" data-run="app.palette" data-menu-title="命令面板" title="命令面板" aria-label="命令面板">
            <span data-icon="command"></span>
          </button>
        </div>
        <button id="todayButton" data-mode="journals" hidden><span data-icon="calendar"></span><span data-menu-text="今天">Today</span></button>
        <nav class="side-switch" aria-label="侧栏视图">
          <button data-mode="tree"><span data-icon="folders"></span><span data-menu-text="浏览目录">目录</span></button>
          <button data-mode="search"><span data-icon="search"></span><span data-menu-text="搜索">搜索</span></button>
          <button id="graphButton" data-mode="graph" data-run="view.graph" data-menu-title="知识库关系图" title="知识库关系图"><span data-icon="graph"></span><span data-menu-text="关系图">关系图</span></button>
        </nav>
        <div id="sideContent"></div>
        <div class="side-foot">
          <button data-run="app.settings" data-menu-title="偏好设置" title="偏好设置"><span data-icon="settings"></span><span data-menu-text="设置">设置</span></button>
          <button data-run="app.palette" data-menu-title="命令面板" title="命令面板"><kbd>⌘⇧P</kbd></button>
        </div>
      </aside>
      <div id="splitter" role="separator" aria-label="调整侧栏宽度" tabindex="0"></div>
      <main id="mainPane">
        <header class="doc-head">
          <button class="sq-icon" data-run="view.sidebar" data-menu-title="显示或隐藏侧栏" title="显示或隐藏侧栏">
            <span data-icon="panel"></span>
          </button>
          <div class="head-divider"></div>
          <button class="sq-icon" id="backBtn" data-run="navigate.back" data-menu-title="后退" title="后退">
            <span data-icon="left"></span>
          </button>
          <button class="sq-icon" id="forwardBtn" data-run="navigate.forward" data-menu-title="前进" title="前进">
            <span data-icon="right"></span>
          </button>
          <div id="tabBar" role="tablist" aria-label="已打开文件"></div>
          <button class="sq-icon" id="newMenu" data-menu-title="新建或打开" title="新建或打开"><span data-icon="plus"></span></button>
        </header>
        <div id="docTools" hidden>
          <div id="breadcrumbs"></div>
          <button class="sq-icon" id="viewButton" data-menu-title="文档视图" title="文档视图">
            <span data-icon="sliders"></span>
          </button>
          <button class="sq-icon" id="documentMenu" data-menu-title="文档操作" title="文档操作"><span data-icon="more"></span></button>
        </div>
        <h1 id="journalHeading" hidden></h1>
        <div id="conflictBar" hidden></div>
        <div id="stage">
          <div id="welcome"></div>
          <div id="hosts"></div>
          <div id="readerTarget" hidden></div>
          <nav id="documentOutline" aria-labelledby="outlineTitle" hidden>
            <div id="outlineTitle" class="side-section" data-menu-text="大纲">Outline</div>
            <div id="outlineList"></div>
          </nav>
        </div>
        <footer id="statusBar"><span id="statusLeft"></span><span id="statusRight"></span></footer>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="bridge.js"></script>
    <script src="editor/vendor/highlight.js"></script>
    <script src="editor/vendor/markdown-it.min.js"></script>
    <script src="editor/vendor/stix/ranges.js"></script>
    <script src="editor/math-config.js"></script>
    <script src="editor/vendor/mathjax-tex-svg.js"></script>
    <script src="editor/vendor/mermaid.min.js"></script>
    <script src="editor/math-layout.js"></script>
    <script src="editor/render.js"></script>
    <script src="wechat-article.js"></script>
    <script src="editor/tables.js"></script>
    <script src="document-scrollbar.js"></script>
    <script src="editor/editor.js"></script>
    <script src="editor/file-data.js"></script>
    <script src="editor/file-preview.js"></script>
    <script src="menu-language.js"></script>
    <script src="settings.js"></script>
    <script src="graph-layout.js"></script>
    <script src="graph.js"></script>
    <script src="shell.js"></script>
  </body>
</html>
